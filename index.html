    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RXDG Ad Builder</title>
    <script>
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() { return _fetch; },
          set(v) { _fetch = v; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Fetch safeguard warning:', e);
      }
    </script>

</head>
